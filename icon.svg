<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2331"/><stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f6994a"/><stop offset="1" stop-color="#e07b32"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c76a24"/><stop offset="1" stop-color="#a8531a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4780b8"/><stop offset="1" stop-color="#2f5f8f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- 背景の薄い等角グリッド -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.05">
    <path d="M256,60 L462,178 M256,60 L50,178 M50,178 L256,296 M462,178 L256,296 M50,334 L256,452 M462,334 L256,452"/>
  </g>
  <g transform="translate(256,262)">
    <!-- 上面 -->
    <path d="M0,-142 L123,-71 L0,0 L-123,-71 Z" fill="url(#top)"/>
    <!-- 右面 -->
    <path d="M0,0 L123,-71 L123,71 L0,142 Z" fill="url(#right)"/>
    <!-- 左面 -->
    <path d="M0,0 L-123,-71 L-123,71 L0,142 Z" fill="url(#left)"/>
    <!-- 面を分割する線＝シフトのコマ割り -->
    <g stroke="#0e1420" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <path d="M-61.5,-106.5 L61.5,-35.5 M61.5,-106.5 L-61.5,-35.5"/>
      <path d="M0,47 L123,-24 M0,95 L123,24"/>
      <path d="M0,47 L-123,-24 M0,95 L-123,24"/>
    </g>
    <!-- エッジのハイライト -->
    <path d="M0,-142 L123,-71 L0,0 L-123,-71 Z" fill="none" stroke="#ffd9b0" stroke-width="3" opacity="0.45"/>
    <path d="M0,0 L0,142" stroke="#0e1420" stroke-width="5" opacity="0.4"/>
  </g>
</svg>
