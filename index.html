<script>
"use strict";
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const mkIcon = (ch) => ({ size = 14, style = {} }) => React.createElement('span', { style: Object.assign({ fontSize: (size * 0.95) + 'px', lineHeight: 1, display: 'inline-block' }, style) }, ch);
const CalendarRange = mkIcon('📅');
const Users = mkIcon('👥');
const MapPin = mkIcon('📍');
const Clock = mkIcon('🕐');
const Plus = mkIcon('＋');
const Trash2 = mkIcon('🗑️');
const Printer = mkIcon('🖨️');
const Download = mkIcon('⬇️');
const RefreshCw = mkIcon('🔄');
const Sparkles = mkIcon('✨');
const Gauge = mkIcon('📊');
const Check = mkIcon('✅');
const AlertTriangle = mkIcon('⚠️');
const Save = mkIcon('💾');
const Lock = mkIcon('🔒');
const Unlock = mkIcon('🔓');
const Warehouse = mkIcon('🏭');
const Package = mkIcon('📦');
const FolderOpen = mkIcon('📂');
/* ============================================================================
 *  ENGINE  (検証済み・2拠点 / 定時+休憩 / 必要時間ベース / 週上限・連勤なし)
 * ==========================================================================*/
const dayIndex = (iso) => Math.floor(Date.parse(iso + "T00:00:00Z") / 86400000);
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const datesOfWeek = (s, n = 7) => Array.from({ length: n }, (_, i) => addDays(s, i));
const parseHM = (t) => { const [h, m] = (t || "0:0").split(":").map(Number); return h + m / 60; };
// 休憩控除：実働6時間超は1時間休憩を引く（例: 9:00-17:00 → 7h）

@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
.ss{--orange:#e07b32;--orange-soft:#fbe6d4;--blue:#3a6ea5;--blue-soft:#e3edf6;--bg:#d8b78a;--panel:#f3e2c7;--panel2:#ecd6b4;--line:#c79a64;--ink:#5a3f22;--muted:#9c7a4e;--green:#5b8a3c;--red:#c0492f;--we:#e8cfa6;
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;color:var(--ink);background:var(--bg);
  background-image:
    linear-gradient(90deg,#0000 0 49.6%,#00000010 49.6% 50.4%,#0000 50.4%),
    repeating-linear-gradient(0deg,#0000 0 13px,#00000008 13px 14px),
    radial-gradient(circle at 50% 0,#ffffff14,transparent 60%);
  background-size:auto, auto, auto;min-height:100vh;line-height:1.55;}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 70px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:13px;}
.logo{width:50px;height:50px;border-radius:12px;background:repeating-linear-gradient(45deg,#cf8f54 0 6px,#c2854d 6px 12px);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #00000018,0 4px 0 #a06b3a;border:2px solid #b07c44;transform:rotate(-3deg);}
.brand h1{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:24px;margin:0;letter-spacing:.02em;text-shadow:0 1px 0 #fff6;}
.ver{display:inline-block;margin-left:9px;background:#1b2331;color:#f6994a;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;vertical-align:3px;letter-spacing:.03em;}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
.saved{display:inline-flex;align-items:center;gap:6px;background:#e3efd6;color:var(--green);border:1px solid #aecb8c;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;}
.save-msg{background:#fff3da;border:1px dashed #d0a45e;color:#8a5a00;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;}
.btn.guide-btn{background:#f3d9a4;border:2px solid #c79a64;color:#6b4a23;box-shadow:0 3px 0 #c79a64;}
.btn.guide-btn:hover{background:#f0d093;} .btn.guide-btn:active{box-shadow:0 1px 0 #c79a64;}
.gmask{position:fixed;inset:0;background:#3a2f23aa;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.guide{background:var(--panel);background-image:repeating-linear-gradient(0deg,#0000 0 22px,#00000005 22px 23px);border:3px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 6px 0 #b8884c,0 22px 50px #0006;overflow:hidden;}
.g-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:17px;color:#6b4a23;background:linear-gradient(180deg,#f0dcbe,#ead2ac);border-bottom:2px dashed var(--line);}
.g-x{background:#fffdf6;border:2px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:800;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;color:var(--ink);box-shadow:0 2px 0 #c79a6455;}
.g-x:active{box-shadow:none;transform:translateY(2px);}
.g-body{overflow-y:auto;padding:18px;}
.g-intro{background:var(--blue-soft);border:1.5px solid #a9c3dd;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;color:#2d567f;margin:0 0 16px;}
.g-step{display:flex;gap:13px;margin-bottom:20px;}
.g-num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:17px;border:2px solid #b5611f;box-shadow:0 3px 0 #a8551a;}
.g-content{flex:1;min-width:0;}
.g-content h3{margin:6px 0 6px;font-family:'M PLUS Rounded 1c',sans-serif;font-size:16px;font-weight:800;color:#5a3f22;}

.te-del{background:#fde2e2;color:#c01616;} .te-ok{background:var(--blue);color:#fff;}
.cell.work.we{background:#fffafd;}
.cell.soft{background:var(--orange-soft);color:#c2570a;font-weight:700;}
.cell.hard{background:#fcdcdc;color:#c01616;font-weight:700;cursor:default;}
.cell.hard:hover{outline:none;}
.cell.rest{background:#fcdcdc;color:#c01616;font-weight:700;} .cell.rest.we{background:#fcdcdc;color:#c01616;}
.cpick{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #1f2a4430;padding:5px;display:flex;gap:5px;}
.cpick button{border:1.5px solid;background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.cov-row td{background:#fafbfd;font-weight:700;font-size:11px;}
.cov-row .c-nm{text-align:right;padding-right:9px;}
.covc.met{color:var(--green);} .covc.over{color:var(--blue);} .covc.short{background:#fdeaea;color:var(--red);} .covc.zero{color:#c9d0db;}
.viols{background:#fff5f5;border:1px solid #f3c0c0;border-radius:12px;padding:12px 15px;margin-top:14px;}
.v-h{display:flex;align-items:center;gap:7px;font-weight:800;color:var(--red);font-size:13.5px;margin-bottom:6px;font-family:'M PLUS Rounded 1c',sans-serif;}
.v-row{font-size:12.5px;color:#a33;padding:2px 0;}
.note{background:var(--orange-soft);border:1px solid #f9a86a;border-radius:12px;padding:12px 15px;font-size:13px;color:#9a4a08;margin-top:14px;}
@media(max-width:560px){.period{gap:12px;}.num{width:44px;}.status{width:110px;}}
